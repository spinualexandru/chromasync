#:schema ../../../schemas/target.json
name = "kvantum"
description = "Kvantum Qt widget theme with matching configuration and SVG artwork."
preferred_template = "materialish"
chroma = "subtle"

[[artifacts]]
file_name = "chromasync.kvconfig"
template = '''
# Generated by Chromasync. Install with the matching chromasync.svg.
[%General]
author=Chromasync
comment=Palette-driven flat Qt widget theme
respect_DE=false
composite=false
menu_shadow_depth=0
tooltip_shadow_depth=0

[GeneralColors]
window.color={{tokens.bg}}
base.color={{tokens.bg}}
alt.base.color={{tokens.bg_secondary}}
button.color={{tokens.surface}}
light.color={{tokens.surface_elevated}}
mid.light.color={{tokens.border_strong}}
dark.color={{tokens.bg_secondary}}
mid.color={{tokens.border}}
shadow.color={{tokens.bg}}
highlight.color={{tokens.selection}}
inactive.highlight.color={{tokens.selection}}
tooltip.base.color={{tokens.surface_elevated}}
text.color={{tokens.text}}
window.text.color={{tokens.text}}
button.text.color={{tokens.text}}
disabled.text.color={{tokens.text_muted}}
tooltip.text.color={{tokens.text}}
highlight.text.color={{tokens.text}}
inactive.highlight.text.color={{tokens.text}}
link.color={{tokens.link}}
link.visited.color={{tokens.accent_active}}
progress.indicator.text.color={{tokens.accent_fg}}

[PanelButtonCommand]
frame=true
frame.element=cs-button
frame.top=1
frame.bottom=1
frame.left=1
frame.right=1
interior=true
interior.element=cs-button
indicator.element=cs-arrow
indicator.size=9
text.shadow=false
text.margin=4
text.iconspacing=4
text.normal.color={{tokens.text}}
text.focus.color={{tokens.text}}
text.press.color={{tokens.text}}
text.toggle.color={{tokens.text}}

[PanelButtonTool]
inherits=PanelButtonCommand
frame=true
frame.element=cs-button
frame.top=1
frame.bottom=1
frame.left=1
frame.right=1
interior.element=cs-button

[Dock]
inherits=PanelButtonCommand
frame=false
interior.element=cs-background
text.margin=0

[DockTitle]
inherits=PanelButtonCommand
frame=false
interior.element=cs-surface

[IndicatorSpinBox]
inherits=PanelButtonCommand
frame=true
frame.element=cs-button
frame.top=1
frame.bottom=1
frame.left=1
frame.right=1
interior.element=cs-button

[RadioButton]
inherits=PanelButtonCommand
frame=false
interior.element=cs-radio
indicator.size=16

[CheckBox]
inherits=PanelButtonCommand
frame=false
interior.element=cs-checkbox
indicator.size=16

[GenericFrame]
inherits=PanelButtonCommand
frame=false
interior.element=cs-background

[LineEdit]
inherits=PanelButtonCommand
frame=true
frame.element=cs-input
frame.top=1
frame.bottom=1
frame.left=1
frame.right=1
interior.element=cs-input

[ToolboxTab]
inherits=PanelButtonCommand
frame=false
interior.element=cs-button

[Tab]
inherits=PanelButtonCommand
frame=false
interior.element=cs-button

[TabFrame]
inherits=PanelButtonCommand
frame=false
interior.element=cs-background
text.margin=0

[TabBarFrame]
inherits=PanelButtonCommand
frame=false
interior.element=cs-background
text.margin=0

[HeaderSection]
inherits=PanelButtonCommand
frame=false
interior.element=cs-surface

[Toolbar]
inherits=PanelButtonCommand
frame=false
interior.element=cs-background
text.margin=0

[Slider]
inherits=PanelButtonCommand
frame=false
interior.element=cs-groove

[SliderCursor]
inherits=PanelButtonCommand
frame=false
interior.element=cs-accent

[Progressbar]
inherits=PanelButtonCommand
frame=false
interior.element=cs-groove

[ProgressbarContents]
inherits=PanelButtonCommand
frame=false
interior.element=cs-accent

[ItemView]
inherits=PanelButtonCommand
frame=false
interior.element=cs-item

[Splitter]
inherits=PanelButtonCommand
frame=false
interior.element=cs-surface

[ScrollbarSlider]
inherits=PanelButtonCommand
frame=false
interior.element=cs-scrollbar

[ScrollbarGroove]
inherits=PanelButtonCommand
frame=false
interior.element=cs-groove

[MenuItem]
inherits=PanelButtonCommand
frame=false
interior.element=cs-item

[MenuBarItem]
inherits=PanelButtonCommand
frame=false
interior.element=cs-item

[MenuBar]
inherits=PanelButtonCommand
frame=false
interior.element=cs-background
text.margin=0

[TitleBar]
inherits=PanelButtonCommand
frame=false
interior.element=cs-surface

[ComboBox]
inherits=PanelButtonCommand
frame=true
frame.element=cs-button
frame.top=1
frame.bottom=1
frame.left=1
frame.right=1
interior.element=cs-button

[Menu]
inherits=PanelButtonCommand
frame=false
interior.element=cs-surface

[GroupBox]
inherits=PanelButtonCommand
frame=false
interior.element=cs-background

[ToolTip]
inherits=PanelButtonCommand
frame=false
interior.element=cs-surface

[Window]
inherits=PanelButtonCommand
frame=false
interior.element=cs-background
text.margin=0

[WindowTranslucent]
inherits=PanelButtonCommand
frame=false
interior.element=cs-background
text.margin=0

[Dialog]
inherits=PanelButtonCommand
frame=false
interior.element=cs-background
text.margin=0

[IndicatorArrow]
indicator.element=cs-arrow
indicator.size=9

[DropDownButton]
inherits=PanelButtonCommand
indicator.element=cs-arrow-down

[Focus]
frame=true
frame.element=cs-focus
frame.top=1
frame.bottom=1
frame.left=1
frame.right=1
interior=false
'''

