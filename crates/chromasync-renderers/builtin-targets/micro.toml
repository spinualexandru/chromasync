#:schema ../../../schemas/target.json
name = "micro"
description = "Built-in micro editor true-color theme target."
preferred_template = "terminal"
chroma = "vibrant"

[[artifacts]]
file_name = "chromasync.micro"
template = """
color-link default "{{tokens.text}},{{tokens.bg}}"
color-link comment "{{tokens.text_muted}}"
color-link identifier "{{tokens.link}}"
color-link identifier.class "{{tokens.link}}"
color-link identifier.macro "{{tokens.accent_active}}"
color-link identifier.var "{{tokens.text}}"
color-link constant "{{tokens.warning}}"
color-link constant.number "{{tokens.warning}}"
color-link constant.string "{{tokens.success}}"
color-link constant.string.url "underline {{tokens.link}}"
color-link symbol "{{tokens.accent_active}}"
color-link statement "{{tokens.accent}}"
color-link preproc "{{tokens.accent_active}}"
color-link type "{{tokens.link}}"
color-link special "{{tokens.error}}"
color-link underlined "underline {{tokens.link}}"
color-link error "bold {{tokens.error}}"
color-link todo "bold {{tokens.warning}}"
color-link statusline "{{tokens.text}},{{tokens.surface_elevated}}"
color-link tabbar "{{tokens.text_muted}},{{tokens.bg_secondary}}"
color-link indent-char "{{tokens.border}}"
color-link line-number "{{tokens.text_muted}}"
color-link current-line-number "{{tokens.accent}}"
color-link gutter-error "{{tokens.error}}"
color-link gutter-warning "{{tokens.warning}}"
color-link cursor-line "{{tokens.surface}}"
color-link color-column "{{tokens.bg_secondary}}"
color-link hlsearch "{{tokens.accent_fg}},{{tokens.accent}}"
color-link match-brace "bold {{tokens.accent}}"
color-link tab-error "{{tokens.error}}"
color-link trailingws "{{tokens.error}}"
"""
