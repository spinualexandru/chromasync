#:schema ../../../schemas/target.json
name = "vim"
description = "Vim true-color colorscheme and terminal palette."
chroma = "normal"

[[artifacts]]
file_name = "chromasync.vim"
template = '''
" Generated by Chromasync. Requires GUI colors or a true-color terminal.
set background={{ctx.mode}}
highlight clear
if exists("syntax_on")
  syntax reset
endif
let g:colors_name = "chromasync"

highlight Normal guifg={{tokens.text}} guibg={{tokens.bg}} gui=NONE cterm=NONE
highlight NormalNC guifg={{tokens.text}} guibg={{tokens.bg}} gui=NONE cterm=NONE
highlight NormalFloat guifg={{tokens.text}} guibg={{tokens.surface_elevated}} gui=NONE cterm=NONE
highlight FloatBorder guifg={{tokens.border_strong}} guibg={{tokens.surface_elevated}} gui=NONE cterm=NONE
highlight ColorColumn guifg=NONE guibg={{tokens.bg_secondary}} gui=NONE cterm=NONE
highlight CursorLine guifg=NONE guibg={{tokens.bg_secondary}} gui=NONE cterm=NONE
highlight CursorColumn guifg=NONE guibg={{tokens.bg_secondary}} gui=NONE cterm=NONE
highlight Cursor guifg={{tokens.accent_fg}} guibg={{tokens.accent}} gui=NONE cterm=NONE
highlight lCursor guifg={{tokens.accent_fg}} guibg={{tokens.accent}} gui=NONE cterm=NONE
highlight LineNr guifg={{tokens.text_muted}} guibg={{tokens.bg}} gui=NONE cterm=NONE
highlight CursorLineNr guifg={{tokens.accent}} guibg={{tokens.bg}} gui=NONE cterm=NONE
highlight SignColumn guifg={{tokens.text_muted}} guibg={{tokens.bg}} gui=NONE cterm=NONE
highlight FoldColumn guifg={{tokens.text_muted}} guibg={{tokens.bg}} gui=NONE cterm=NONE
highlight Folded guifg={{tokens.text_muted}} guibg={{tokens.bg_secondary}} gui=NONE cterm=NONE
highlight NonText guifg={{tokens.text_muted}} guibg=NONE gui=NONE cterm=NONE
highlight SpecialKey guifg={{tokens.text_muted}} guibg=NONE gui=NONE cterm=NONE
highlight EndOfBuffer guifg={{tokens.bg}} guibg=NONE gui=NONE cterm=NONE
highlight VertSplit guifg={{tokens.border}} guibg=NONE gui=NONE cterm=NONE
highlight WinSeparator guifg={{tokens.border}} guibg=NONE gui=NONE cterm=NONE
highlight StatusLine guifg={{tokens.text}} guibg={{tokens.surface_elevated}} gui=NONE cterm=NONE
highlight StatusLineNC guifg={{tokens.text_muted}} guibg={{tokens.bg_secondary}} gui=NONE cterm=NONE
highlight TabLine guifg={{tokens.text_muted}} guibg={{tokens.bg_secondary}} gui=NONE cterm=NONE
highlight TabLineFill guifg={{tokens.text}} guibg={{tokens.bg_secondary}} gui=NONE cterm=NONE
highlight TabLineSel guifg={{tokens.accent_fg}} guibg={{tokens.accent}} gui=NONE cterm=NONE
highlight WinBar guifg={{tokens.text}} guibg={{tokens.bg}} gui=NONE cterm=NONE
highlight WinBarNC guifg={{tokens.text_muted}} guibg={{tokens.bg}} gui=NONE cterm=NONE
highlight Pmenu guifg={{tokens.text}} guibg={{tokens.surface_elevated}} gui=NONE cterm=NONE
highlight PmenuSel guifg={{tokens.text}} guibg={{tokens.selection}} gui=NONE cterm=NONE
highlight PmenuSbar guifg=NONE guibg={{tokens.bg_secondary}} gui=NONE cterm=NONE
highlight PmenuThumb guifg=NONE guibg={{tokens.border_strong}} gui=NONE cterm=NONE
highlight Visual guifg={{tokens.text}} guibg={{tokens.selection}} gui=NONE cterm=NONE
highlight VisualNOS guifg={{tokens.text}} guibg={{tokens.selection}} gui=NONE cterm=NONE
highlight Search guifg={{tokens.accent_fg}} guibg={{tokens.accent}} gui=NONE cterm=NONE
highlight IncSearch guifg={{tokens.accent_fg}} guibg={{tokens.accent_hover}} gui=NONE cterm=NONE
highlight CurSearch guifg={{tokens.accent_fg}} guibg={{tokens.accent}} gui=NONE cterm=NONE
highlight MatchParen guifg={{tokens.text}} guibg={{tokens.selection}} gui=NONE cterm=NONE
highlight QuickFixLine guifg={{tokens.text}} guibg={{tokens.selection}} gui=NONE cterm=NONE
highlight Directory guifg={{tokens.link}} guibg=NONE gui=NONE cterm=NONE
highlight Title guifg={{tokens.accent}} guibg=NONE gui=NONE cterm=NONE
highlight Question guifg={{tokens.success}} guibg=NONE gui=NONE cterm=NONE
highlight MoreMsg guifg={{tokens.success}} guibg=NONE gui=NONE cterm=NONE
highlight ModeMsg guifg={{tokens.text}} guibg=NONE gui=NONE cterm=NONE
highlight WarningMsg guifg={{tokens.warning}} guibg=NONE gui=NONE cterm=NONE
highlight ErrorMsg guifg={{tokens.error}} guibg={{tokens.bg}} gui=NONE cterm=NONE
highlight Comment guifg={{tokens.text_muted}} guibg=NONE gui=NONE cterm=NONE
highlight Constant guifg={{tokens.warning}} guibg=NONE gui=NONE cterm=NONE
highlight String guifg={{tokens.success}} guibg=NONE gui=NONE cterm=NONE
highlight Character guifg={{tokens.success}} guibg=NONE gui=NONE cterm=NONE
highlight Number guifg={{tokens.warning}} guibg=NONE gui=NONE cterm=NONE
highlight Boolean guifg={{tokens.warning}} guibg=NONE gui=NONE cterm=NONE
highlight Float guifg={{tokens.warning}} guibg=NONE gui=NONE cterm=NONE
highlight Identifier guifg={{tokens.text}} guibg=NONE gui=NONE cterm=NONE
highlight Function guifg={{tokens.link}} guibg=NONE gui=NONE cterm=NONE
highlight Statement guifg={{tokens.accent}} guibg=NONE gui=NONE cterm=NONE
highlight Conditional guifg={{tokens.accent}} guibg=NONE gui=NONE cterm=NONE
highlight Repeat guifg={{tokens.accent}} guibg=NONE gui=NONE cterm=NONE
highlight Label guifg={{tokens.accent}} guibg=NONE gui=NONE cterm=NONE
highlight Operator guifg={{tokens.accent_active}} guibg=NONE gui=NONE cterm=NONE
highlight Keyword guifg={{tokens.accent}} guibg=NONE gui=NONE cterm=NONE
highlight Exception guifg={{tokens.accent}} guibg=NONE gui=NONE cterm=NONE
highlight PreProc guifg={{tokens.accent_active}} guibg=NONE gui=NONE cterm=NONE
highlight Type guifg={{tokens.accent_active}} guibg=NONE gui=NONE cterm=NONE
highlight Special guifg={{tokens.link}} guibg=NONE gui=NONE cterm=NONE
highlight Delimiter guifg={{tokens.text_muted}} guibg=NONE gui=NONE cterm=NONE
highlight Underlined guifg={{tokens.link}} guibg=NONE gui=underline cterm=underline
highlight Ignore guifg={{tokens.text_muted}} guibg=NONE gui=NONE cterm=NONE
highlight Error guifg={{tokens.error}} guibg={{tokens.bg}} gui=NONE cterm=NONE
highlight Todo guifg={{tokens.accent_fg}} guibg={{tokens.warning}} gui=bold cterm=bold
highlight DiffAdd guifg={{tokens.success}} guibg={{tokens.bg}} gui=NONE cterm=NONE
highlight DiffDelete guifg={{tokens.error}} guibg={{tokens.bg}} gui=NONE cterm=NONE
highlight DiffChange guifg={{tokens.warning}} guibg={{tokens.bg}} gui=NONE cterm=NONE
highlight DiffText guifg={{tokens.accent_fg}} guibg={{tokens.warning}} gui=NONE cterm=NONE
highlight SpellBad guifg=NONE guibg=NONE guisp={{tokens.error}} gui=undercurl cterm=underline
highlight SpellCap guifg=NONE guibg=NONE guisp={{tokens.warning}} gui=undercurl cterm=underline
highlight SpellRare guifg=NONE guibg=NONE guisp={{tokens.accent}} gui=undercurl cterm=underline
highlight SpellLocal guifg=NONE guibg=NONE guisp={{tokens.link}} gui=undercurl cterm=underline

let g:terminal_ansi_colors = ["{{tokens.bg_secondary}}", "{{tokens.error}}", "{{tokens.success}}", "{{tokens.warning}}", "{{tokens.link}}", "{{tokens.accent}}", "{{tokens.accent_hover}}", "{{tokens.text_muted}}", "{{tokens.border_strong}}", "{{tokens.error}}", "{{tokens.success}}", "{{tokens.warning}}", "{{tokens.link}}", "{{tokens.accent_active}}", "{{tokens.accent_hover}}", "{{tokens.text}}"]
'''
