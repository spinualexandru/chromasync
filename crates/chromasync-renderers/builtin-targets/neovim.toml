#:schema ../../../schemas/target.json
name = "neovim"
description = "Neovim Lua colorscheme with Tree-sitter, LSP, diagnostics and terminal colors."
chroma = "normal"

[[artifacts]]
file_name = "chromasync.lua"
template = '''
-- Generated by Chromasync. Enable termguicolors in your init.lua.
vim.o.background = "{{ctx.mode}}"
vim.cmd("highlight clear")
if vim.fn.exists("syntax_on") == 1 then
  vim.cmd("syntax reset")
end
vim.g.colors_name = "chromasync"

local groups = {
  Normal = { fg = "{{tokens.text}}", bg = "{{tokens.bg}}" },
  NormalNC = { fg = "{{tokens.text}}", bg = "{{tokens.bg}}" },
  NormalFloat = { fg = "{{tokens.text}}", bg = "{{tokens.surface_elevated}}" },
  FloatBorder = { fg = "{{tokens.border_strong}}", bg = "{{tokens.surface_elevated}}" },
  ColorColumn = { bg = "{{tokens.bg_secondary}}" },
  CursorLine = { bg = "{{tokens.bg_secondary}}" },
  CursorColumn = { bg = "{{tokens.bg_secondary}}" },
  Cursor = { fg = "{{tokens.accent_fg}}", bg = "{{tokens.accent}}" },
  lCursor = { fg = "{{tokens.accent_fg}}", bg = "{{tokens.accent}}" },
  LineNr = { fg = "{{tokens.text_muted}}", bg = "{{tokens.bg}}" },
  CursorLineNr = { fg = "{{tokens.accent}}", bg = "{{tokens.bg}}" },
  SignColumn = { fg = "{{tokens.text_muted}}", bg = "{{tokens.bg}}" },
  FoldColumn = { fg = "{{tokens.text_muted}}", bg = "{{tokens.bg}}" },
  Folded = { fg = "{{tokens.text_muted}}", bg = "{{tokens.bg_secondary}}" },
  NonText = { fg = "{{tokens.text_muted}}" },
  SpecialKey = { fg = "{{tokens.text_muted}}" },
  EndOfBuffer = { fg = "{{tokens.bg}}" },
  VertSplit = { fg = "{{tokens.border}}" },
  WinSeparator = { fg = "{{tokens.border}}" },
  StatusLine = { fg = "{{tokens.text}}", bg = "{{tokens.surface_elevated}}" },
  StatusLineNC = { fg = "{{tokens.text_muted}}", bg = "{{tokens.bg_secondary}}" },
  TabLine = { fg = "{{tokens.text_muted}}", bg = "{{tokens.bg_secondary}}" },
  TabLineFill = { fg = "{{tokens.text}}", bg = "{{tokens.bg_secondary}}" },
  TabLineSel = { fg = "{{tokens.accent_fg}}", bg = "{{tokens.accent}}" },
  WinBar = { fg = "{{tokens.text}}", bg = "{{tokens.bg}}" },
  WinBarNC = { fg = "{{tokens.text_muted}}", bg = "{{tokens.bg}}" },
  Pmenu = { fg = "{{tokens.text}}", bg = "{{tokens.surface_elevated}}" },
  PmenuSel = { fg = "{{tokens.text}}", bg = "{{tokens.selection}}" },
  PmenuSbar = { bg = "{{tokens.bg_secondary}}" },
  PmenuThumb = { bg = "{{tokens.border_strong}}" },
  Visual = { fg = "{{tokens.text}}", bg = "{{tokens.selection}}" },
  VisualNOS = { fg = "{{tokens.text}}", bg = "{{tokens.selection}}" },
  Search = { fg = "{{tokens.accent_fg}}", bg = "{{tokens.accent}}" },
  IncSearch = { fg = "{{tokens.accent_fg}}", bg = "{{tokens.accent_hover}}" },
  CurSearch = { fg = "{{tokens.accent_fg}}", bg = "{{tokens.accent}}" },
  MatchParen = { fg = "{{tokens.text}}", bg = "{{tokens.selection}}" },
  QuickFixLine = { fg = "{{tokens.text}}", bg = "{{tokens.selection}}" },
  Directory = { fg = "{{tokens.link}}" },
  Title = { fg = "{{tokens.accent}}" },
  Question = { fg = "{{tokens.success}}" },
  MoreMsg = { fg = "{{tokens.success}}" },
  ModeMsg = { fg = "{{tokens.text}}" },
  WarningMsg = { fg = "{{tokens.warning}}" },
  ErrorMsg = { fg = "{{tokens.error}}", bg = "{{tokens.bg}}" },
  Comment = { fg = "{{tokens.text_muted}}" },
  Constant = { fg = "{{tokens.warning}}" },
  String = { fg = "{{tokens.success}}" },
  Character = { fg = "{{tokens.success}}" },
  Number = { fg = "{{tokens.warning}}" },
  Boolean = { fg = "{{tokens.warning}}" },
  Float = { fg = "{{tokens.warning}}" },
  Identifier = { fg = "{{tokens.text}}" },
  Function = { fg = "{{tokens.link}}" },
  Statement = { fg = "{{tokens.accent}}" },
  Conditional = { fg = "{{tokens.accent}}" },
  Repeat = { fg = "{{tokens.accent}}" },
  Label = { fg = "{{tokens.accent}}" },
  Operator = { fg = "{{tokens.accent_active}}" },
  Keyword = { fg = "{{tokens.accent}}" },
  Exception = { fg = "{{tokens.accent}}" },
  PreProc = { fg = "{{tokens.accent_active}}" },
  Type = { fg = "{{tokens.accent_active}}" },
  Special = { fg = "{{tokens.link}}" },
  Delimiter = { fg = "{{tokens.text_muted}}" },
  Underlined = { fg = "{{tokens.link}}", underline = true },
  Ignore = { fg = "{{tokens.text_muted}}" },
  Error = { fg = "{{tokens.error}}", bg = "{{tokens.bg}}" },
  Todo = { fg = "{{tokens.accent_fg}}", bg = "{{tokens.warning}}", bold = true },
  DiffAdd = { fg = "{{tokens.success}}", bg = "{{tokens.bg}}" },
  DiffDelete = { fg = "{{tokens.error}}", bg = "{{tokens.bg}}" },
  DiffChange = { fg = "{{tokens.warning}}", bg = "{{tokens.bg}}" },
  DiffText = { fg = "{{tokens.accent_fg}}", bg = "{{tokens.warning}}" },
  DiagnosticError = { fg = "{{tokens.error}}" },
  DiagnosticUnderlineError = { sp = "{{tokens.error}}", undercurl = true },
  DiagnosticWarn = { fg = "{{tokens.warning}}" },
  DiagnosticUnderlineWarn = { sp = "{{tokens.warning}}", undercurl = true },
  DiagnosticInfo = { fg = "{{tokens.link}}" },
  DiagnosticUnderlineInfo = { sp = "{{tokens.link}}", undercurl = true },
  DiagnosticHint = { fg = "{{tokens.accent}}" },
  DiagnosticUnderlineHint = { sp = "{{tokens.accent}}", undercurl = true },
  DiagnosticOk = { fg = "{{tokens.success}}" },
  DiagnosticUnderlineOk = { sp = "{{tokens.success}}", undercurl = true },
  SpellBad = { sp = "{{tokens.error}}", undercurl = true },
  SpellCap = { sp = "{{tokens.warning}}", undercurl = true },
  SpellRare = { sp = "{{tokens.accent}}", undercurl = true },
  SpellLocal = { sp = "{{tokens.link}}", undercurl = true },
}
for name, attrs in pairs(groups) do
  vim.api.nvim_set_hl(0, name, attrs)
end

local links = {
  ["@comment"] = "Comment",
  ["@string"] = "String",
  ["@character"] = "Character",
  ["@number"] = "Number",
  ["@boolean"] = "Boolean",
  ["@constant"] = "Constant",
  ["@variable"] = "Identifier",
  ["@variable.parameter"] = "Identifier",
  ["@function"] = "Function",
  ["@function.method"] = "Function",
  ["@constructor"] = "Function",
  ["@keyword"] = "Keyword",
  ["@operator"] = "Operator",
  ["@type"] = "Type",
  ["@property"] = "Identifier",
  ["@punctuation"] = "Delimiter",
  ["@tag"] = "Statement",
  ["@markup.heading"] = "Title",
  ["@markup.link"] = "Underlined",
  ["@markup.raw"] = "String",
  ["@diff.plus"] = "DiffAdd",
  ["@diff.minus"] = "DiffDelete",
  ["@diff.delta"] = "DiffChange",
  ["@lsp.type.class"] = "Type",
  ["@lsp.type.enum"] = "Type",
  ["@lsp.type.interface"] = "Type",
  ["@lsp.type.struct"] = "Type",
  ["@lsp.type.parameter"] = "Identifier",
  ["@lsp.type.property"] = "Identifier",
  ["@lsp.type.function"] = "Function",
  ["@lsp.type.method"] = "Function",
}
for name, link in pairs(links) do
  vim.api.nvim_set_hl(0, name, { link = link })
end

vim.g.terminal_color_0 = "{{tokens.bg_secondary}}"
vim.g.terminal_color_1 = "{{tokens.error}}"
vim.g.terminal_color_2 = "{{tokens.success}}"
vim.g.terminal_color_3 = "{{tokens.warning}}"
vim.g.terminal_color_4 = "{{tokens.link}}"
vim.g.terminal_color_5 = "{{tokens.accent}}"
vim.g.terminal_color_6 = "{{tokens.accent_hover}}"
vim.g.terminal_color_7 = "{{tokens.text_muted}}"
vim.g.terminal_color_8 = "{{tokens.border_strong}}"
vim.g.terminal_color_9 = "{{tokens.error}}"
vim.g.terminal_color_10 = "{{tokens.success}}"
vim.g.terminal_color_11 = "{{tokens.warning}}"
vim.g.terminal_color_12 = "{{tokens.link}}"
vim.g.terminal_color_13 = "{{tokens.accent_active}}"
vim.g.terminal_color_14 = "{{tokens.accent_hover}}"
vim.g.terminal_color_15 = "{{tokens.text}}"
'''
