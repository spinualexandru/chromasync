#:schema ../../../schemas/target.json
name = "vscode"
description = "Built-in Visual Studio Code color theme extension target."
preferred_template = "materialish"
chroma = "normal"

[[artifacts]]
file_name = "package.json"
template = """
{
  "name": "chromasync-theme",
  "displayName": "Chromasync Theme",
  "description": "A color theme generated by Chromasync.",
  "version": "1.0.0",
  "publisher": "chromasync",
  "engines": {
    "vscode": "^1.80.0"
  },
  "categories": ["Themes"],
  "contributes": {
    "themes": [
      {
        "label": "Chromasync {{ctx.mode}}",
        "uiTheme": "{{ctx.mode | mode(dark=vs-dark,light=vs)}}",
        "path": "./chromasync-color-theme.json"
      }
    ]
  }
}
"""

[[artifacts]]
file_name = "chromasync-color-theme.json"
template = """
{
  "$schema": "https://raw.githubusercontent.com/microsoft/vscode/main/extensions/theme-defaults/schemas/color-theme.json",
  "name": "Chromasync {{ctx.mode}}",
  "type": "{{ctx.mode}}",
  "semanticHighlighting": true,
  "colors": {
    "foreground": "{{tokens.text}}",
    "descriptionForeground": "{{tokens.text_muted}}",
    "disabledForeground": "{{tokens.text_muted}}",
    "focusBorder": "{{tokens.accent}}",
    "selection.background": "{{tokens.selection}}",
    "errorForeground": "{{tokens.error}}",
    "icon.foreground": "{{tokens.text}}",
    "activityBar.background": "{{tokens.bg_secondary}}",
    "activityBar.foreground": "{{tokens.text}}",
    "activityBar.inactiveForeground": "{{tokens.text_muted}}",
    "activityBarBadge.background": "{{tokens.accent}}",
    "activityBarBadge.foreground": "{{tokens.accent_fg}}",
    "badge.background": "{{tokens.accent}}",
    "badge.foreground": "{{tokens.accent_fg}}",
    "button.background": "{{tokens.accent}}",
    "button.foreground": "{{tokens.accent_fg}}",
    "button.hoverBackground": "{{tokens.accent_hover}}",
    "dropdown.background": "{{tokens.surface}}",
    "dropdown.border": "{{tokens.border}}",
    "dropdown.foreground": "{{tokens.text}}",
    "editor.background": "{{tokens.bg}}",
    "editor.foreground": "{{tokens.text}}",
    "editor.findMatchBackground": "{{tokens.accent_active}}",
    "editor.findMatchHighlightBackground": "{{tokens.selection}}",
    "editor.lineHighlightBackground": "{{tokens.surface}}",
    "editor.selectionBackground": "{{tokens.selection}}",
    "editorCursor.foreground": "{{tokens.accent}}",
    "editorError.foreground": "{{tokens.error}}",
    "editorGroup.border": "{{tokens.border}}",
    "editorGutter.background": "{{tokens.bg}}",
    "editorLineNumber.foreground": "{{tokens.text_muted}}",
    "editorLineNumber.activeForeground": "{{tokens.text}}",
    "editorWarning.foreground": "{{tokens.warning}}",
    "editorWhitespace.foreground": "{{tokens.border}}",
    "input.background": "{{tokens.surface}}",
    "input.border": "{{tokens.border}}",
    "input.foreground": "{{tokens.text}}",
    "input.placeholderForeground": "{{tokens.text_muted}}",
    "list.activeSelectionBackground": "{{tokens.selection}}",
    "list.activeSelectionForeground": "{{tokens.text}}",
    "list.hoverBackground": "{{tokens.surface_elevated}}",
    "notifications.background": "{{tokens.surface_elevated}}",
    "notifications.border": "{{tokens.border_strong}}",
    "notifications.foreground": "{{tokens.text}}",
    "notificationsErrorIcon.foreground": "{{tokens.error}}",
    "notificationsInfoIcon.foreground": "{{tokens.link}}",
    "notificationsWarningIcon.foreground": "{{tokens.warning}}",
    "panel.background": "{{tokens.bg}}",
    "panel.border": "{{tokens.border_strong}}",
    "peekView.border": "{{tokens.accent}}",
    "peekViewEditor.background": "{{tokens.surface}}",
    "peekViewResult.background": "{{tokens.bg_secondary}}",
    "sideBar.background": "{{tokens.surface}}",
    "sideBar.border": "{{tokens.border}}",
    "sideBar.foreground": "{{tokens.text}}",
    "sideBarTitle.foreground": "{{tokens.text}}",
    "statusBar.background": "{{tokens.surface_elevated}}",
    "statusBar.foreground": "{{tokens.text}}",
    "statusBar.debuggingBackground": "{{tokens.warning}}",
    "statusBar.debuggingForeground": "{{tokens.accent_fg}}",
    "tab.activeBackground": "{{tokens.bg}}",
    "tab.activeBorderTop": "{{tokens.accent}}",
    "tab.activeForeground": "{{tokens.text}}",
    "tab.border": "{{tokens.border}}",
    "tab.inactiveBackground": "{{tokens.surface}}",
    "tab.inactiveForeground": "{{tokens.text_muted}}",
    "terminal.ansiBlack": "{{tokens.bg_secondary}}",
    "terminal.ansiBlue": "{{tokens.link}}",
    "terminal.ansiBrightBlack": "{{tokens.text_muted}}",
    "terminal.ansiBrightBlue": "{{tokens.accent_hover}}",
    "terminal.ansiBrightCyan": "{{tokens.border_strong}}",
    "terminal.ansiBrightGreen": "{{tokens.success}}",
    "terminal.ansiBrightMagenta": "{{tokens.accent_active}}",
    "terminal.ansiBrightRed": "{{tokens.error}}",
    "terminal.ansiBrightWhite": "{{tokens.text}}",
    "terminal.ansiBrightYellow": "{{tokens.warning}}",
    "terminal.ansiCyan": "{{tokens.selection}}",
    "terminal.ansiGreen": "{{tokens.success}}",
    "terminal.ansiMagenta": "{{tokens.accent}}",
    "terminal.ansiRed": "{{tokens.error}}",
    "terminal.ansiWhite": "{{tokens.border_strong}}",
    "terminal.ansiYellow": "{{tokens.warning}}",
    "terminal.background": "{{tokens.bg}}",
    "terminal.foreground": "{{tokens.text}}",
    "terminal.selectionBackground": "{{tokens.selection}}",
    "textLink.activeForeground": "{{tokens.accent_active}}",
    "textLink.foreground": "{{tokens.link}}",
    "titleBar.activeBackground": "{{tokens.bg_secondary}}",
    "titleBar.activeForeground": "{{tokens.text}}",
    "titleBar.inactiveBackground": "{{tokens.surface}}",
    "titleBar.inactiveForeground": "{{tokens.text_muted}}"
  },
  "tokenColors": [
    {"scope": ["comment", "punctuation.definition.comment"], "settings": {"foreground": "{{tokens.text_muted}}", "fontStyle": "italic"}},
    {"scope": ["string", "constant.other.symbol"], "settings": {"foreground": "{{tokens.success}}"}},
    {"scope": ["constant.numeric", "constant.language"], "settings": {"foreground": "{{tokens.warning}}"}},
    {"scope": ["keyword", "storage.type", "storage.modifier"], "settings": {"foreground": "{{tokens.accent}}"}},
    {"scope": ["entity.name.function", "support.function"], "settings": {"foreground": "{{tokens.link}}"}},
    {"scope": ["entity.name.type", "support.type", "support.class"], "settings": {"foreground": "{{tokens.accent_active}}"}},
    {"scope": ["variable", "meta.definition.variable"], "settings": {"foreground": "{{tokens.text}}"}},
    {"scope": ["invalid", "invalid.illegal"], "settings": {"foreground": "{{tokens.accent_fg}}", "background": "{{tokens.error}}"}}
  ],
  "semanticTokenColors": {
    "class": "{{tokens.accent_active}}",
    "enum": "{{tokens.accent_active}}",
    "function": "{{tokens.link}}",
    "interface": "{{tokens.accent_active}}",
    "keyword": "{{tokens.accent}}",
    "method": "{{tokens.link}}",
    "number": "{{tokens.warning}}",
    "parameter": "{{tokens.text}}",
    "property": "{{tokens.text}}",
    "string": "{{tokens.success}}",
    "type": "{{tokens.accent_active}}",
    "variable": "{{tokens.text}}"
  }
}
"""
