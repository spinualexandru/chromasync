#:schema ../../../schemas/target.json
name = "gtk3"
description = "Built-in GTK 3 stylesheet target."
preferred_template = "materialish"
chroma = "vibrant"

[[artifacts]]
file_name = "gtk.css"
template = '''@import url("chromasync.css");
'''

[[artifacts]]
file_name = "chromasync.css"
template = """
@define-color theme_bg_color {{tokens.bg_secondary}};
@define-color theme_fg_color {{tokens.text}};
@define-color theme_base_color {{tokens.bg}};
@define-color theme_text_color {{tokens.text}};
@define-color theme_selected_bg_color {{tokens.selection}};
@define-color theme_selected_fg_color {{tokens.text}};
@define-color insensitive_bg_color {{tokens.bg_secondary}};
@define-color insensitive_fg_color {{tokens.text_muted}};
@define-color insensitive_base_color {{tokens.bg}};
@define-color theme_unfocused_bg_color {{tokens.bg_secondary}};
@define-color theme_unfocused_fg_color {{tokens.text_muted}};
@define-color theme_unfocused_base_color {{tokens.bg}};
@define-color theme_unfocused_text_color {{tokens.text_muted}};
@define-color theme_unfocused_selected_bg_color {{tokens.surface_elevated}};
@define-color theme_unfocused_selected_fg_color {{tokens.text}};
@define-color borders {{tokens.border}};
@define-color unfocused_borders {{tokens.border}};
@define-color warning_color {{tokens.warning}};
@define-color error_color {{tokens.error}};
@define-color success_color {{tokens.success}};
@define-color link_color {{tokens.link}};
@define-color titlebar_bg_color {{tokens.surface}};
@define-color titlebar_fg_color {{tokens.text}};
@define-color theme_titlebar_bg_color {{tokens.surface}};
@define-color theme_titlebar_fg_color {{tokens.text}};
@define-color menubar_bg_color {{tokens.bg_secondary}};
@define-color menubar_fg_color {{tokens.text}};
@define-color toolbar_bg_color {{tokens.surface}};
@define-color toolbar_fg_color {{tokens.text}};
@define-color sidebar_bg_color {{tokens.surface}};
@define-color sidebar_fg_color {{tokens.text}};
@define-color content_view_bg {{tokens.bg}};
@define-color text_view_bg {{tokens.bg}};
@define-color terminal_bg_color {{tokens.bg}};
@define-color terminal_fg_color {{tokens.text}};
@define-color theme_button_background_normal {{tokens.surface}};
@define-color theme_button_foreground_normal {{tokens.text}};
@define-color theme_button_background_hover {{tokens.surface_elevated}};
@define-color theme_entry_background {{tokens.bg_secondary}};
@define-color theme_entry_foreground {{tokens.text}};

window,
dialog,
popover,
menu {
  background-color: @theme_bg_color;
  color: @theme_fg_color;
}

dialog {
  background-color: {{tokens.surface_elevated}};
  color: @theme_fg_color;
}

popover,
menu,
menubar,
context-menu {
  background-color: {{tokens.surface_elevated}};
  color: @theme_fg_color;
  border-color: {{tokens.border_strong}};
}

tooltip {
  background-color: {{tokens.surface_elevated}};
  color: @theme_fg_color;
  border-color: {{tokens.border_strong}};
}

headerbar,
.titlebar,
toolbar,
GtkHeaderBar,
GtkToolbar,
.searchbar-container,
GtkSearchBar {
  background-color: @titlebar_bg_color;
  color: @titlebar_fg_color;
  border-color: {{tokens.border_strong}};
}

.searchbar-container.inline,
GtkSearchBar.inline {
  background-color: @theme_base_color;
  color: @theme_text_color;
  border-color: @borders;
}

NautilusWindow .sidebar,
NemoWindow .sidebar,
.sidebar,
GtkPlacesSidebar,
placessidebar {
  background-color: @sidebar_bg_color;
  color: @sidebar_fg_color;
  border-color: {{tokens.border_strong}};
}

textview,
treeview,
.view,
.content-view,
NautilusWindow .view {
  background-color: @theme_base_color;
  color: @theme_text_color;
  border-color: @borders;
}

entry,
GtkEntry,
searchentry {
  background-color: @theme_entry_background;
  color: @theme_entry_foreground;
  border-color: @borders;
  caret-color: {{tokens.accent}};
}

headerbar entry,
.titlebar entry,
.searchbar-container entry,
GtkSearchBar entry,
headerbar GtkEntry {
  background-color: @theme_base_color;
  color: @theme_text_color;
  border-color: {{tokens.border_strong}};
}

entry:focus,
GtkEntry:focus {
  border-color: {{tokens.accent}};
}

entry placeholder {
  color: {{tokens.text_muted}};
}

entry:disabled {
  background-color: {{tokens.bg_secondary}};
  color: {{tokens.text_muted}};
}

entry selection,
textview selection,
.view selection {
  background-color: @theme_selected_bg_color;
  color: @theme_selected_fg_color;
}

VteTerminal,
vte-terminal,
TerminalWindow,
.terminal,
console {
  background-color: @terminal_bg_color;
  color: @terminal_fg_color;
}

.card,
.card-view,
list.boxed-list {
  background-color: {{tokens.surface_elevated}};
  color: @theme_fg_color;
  border-color: @borders;
}

button,
GtkButton {
  background-color: @theme_button_background_normal;
  color: @theme_button_foreground_normal;
  border-color: @borders;
}

headerbar button,
.titlebar button {
  background-color: {{tokens.surface_elevated}};
  color: @theme_fg_color;
  border-color: @borders;
}

button:hover {
  background-color: @theme_button_background_hover;
  border-color: {{tokens.accent_hover}};
}

button:active {
  background-color: {{tokens.accent_active}};
  color: {{tokens.accent_fg}};
  border-color: {{tokens.accent_active}};
}

button:disabled {
  background-color: {{tokens.bg_secondary}};
  color: {{tokens.text_muted}};
  border-color: @borders;
}

button.suggested-action,
button:checked,
switch:checked slider {
  background-color: {{tokens.accent}};
  color: {{tokens.accent_fg}};
  border-color: {{tokens.accent}};
}

button.destructive-action {
  background-color: {{tokens.error}};
  color: {{tokens.accent_fg}};
  border-color: {{tokens.error}};
}

.info {
  background-color: {{tokens.accent}};
  color: {{tokens.accent_fg}};
}

.success {
  background-color: {{tokens.success}};
  color: {{tokens.accent_fg}};
}

.warning {
  background-color: {{tokens.warning}};
  color: {{tokens.accent_fg}};
}

.error {
  background-color: {{tokens.error}};
  color: {{tokens.accent_fg}};
}

selection {
  background-color: @theme_selected_bg_color;
  color: @theme_selected_fg_color;
}

a,
link {
  color: @link_color;
}

.dim-label,
.subtitle {
  color: {{tokens.text_muted}};
}

*:focus {
  outline-color: {{tokens.accent}};
}
"""
