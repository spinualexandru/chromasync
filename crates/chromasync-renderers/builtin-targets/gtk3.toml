#:schema ../../../schemas/target.json
name = "gtk3"
description = "Built-in GTK 3 stylesheet target."
preferred_template = "materialish"
chroma = "vibrant"

[[artifacts]]
file_name = "gtk.css"
template = '''@import url("chromasync.css");
'''

[[artifacts]]
file_name = "chromasync.css"
template = """
@define-color theme_bg_color {{tokens.bg_secondary}};
@define-color theme_fg_color {{tokens.text}};
@define-color theme_base_color {{tokens.bg}};
@define-color theme_text_color {{tokens.text}};
@define-color theme_selected_bg_color {{tokens.selection}};
@define-color theme_selected_fg_color {{tokens.text}};
@define-color insensitive_bg_color {{tokens.bg_secondary}};
@define-color insensitive_fg_color {{tokens.text_muted}};
@define-color insensitive_base_color {{tokens.bg}};
@define-color theme_unfocused_bg_color {{tokens.bg_secondary}};
@define-color theme_unfocused_fg_color {{tokens.text_muted}};
@define-color theme_unfocused_base_color {{tokens.bg}};
@define-color theme_unfocused_text_color {{tokens.text_muted}};
@define-color theme_unfocused_selected_bg_color {{tokens.surface_elevated}};
@define-color theme_unfocused_selected_fg_color {{tokens.text}};
@define-color borders {{tokens.border}};
@define-color unfocused_borders {{tokens.border}};
@define-color warning_color {{tokens.warning}};
@define-color error_color {{tokens.error}};
@define-color success_color {{tokens.success}};
@define-color link_color {{tokens.link}};
@define-color titlebar_bg_color {{tokens.surface}};
@define-color titlebar_fg_color {{tokens.text}};
@define-color theme_titlebar_bg_color {{tokens.surface}};
@define-color theme_titlebar_fg_color {{tokens.text}};
@define-color menubar_bg_color {{tokens.bg_secondary}};
@define-color menubar_fg_color {{tokens.text}};
@define-color toolbar_bg_color {{tokens.surface}};
@define-color toolbar_fg_color {{tokens.text}};
@define-color sidebar_bg_color {{tokens.surface}};
@define-color sidebar_fg_color {{tokens.text}};
@define-color content_view_bg {{tokens.bg}};
@define-color text_view_bg {{tokens.bg}};
@define-color terminal_bg_color {{tokens.bg}};
@define-color terminal_fg_color {{tokens.text}};
@define-color theme_button_background_normal {{tokens.surface}};
@define-color theme_button_foreground_normal {{tokens.text}};
@define-color theme_button_background_hover {{tokens.surface_elevated}};
@define-color theme_entry_background {{tokens.bg_secondary}};
@define-color theme_entry_foreground {{tokens.text}};

.background,
window,
dialog,
popover,
menu {
  background-color: @theme_bg_color;
  color: @theme_fg_color;
}

dialog,
dialog.background {
  background-color: {{tokens.surface_elevated}};
  color: @theme_fg_color;
}

popover,
popover.background,
menu,
menubar,
context-menu {
  background-color: {{tokens.surface_elevated}};
  color: @theme_fg_color;
  border-color: {{tokens.border_strong}};
}

/* Popover model buttons use their own CSS node, not the button rules. */
modelbutton,
menuitem {
  background-color: transparent;
  background-image: none;
  color: @theme_fg_color;
  text-shadow: none;
  -gtk-icon-shadow: none;
  box-shadow: none;
}

modelbutton label,
modelbutton image,
menuitem label,
menuitem image {
  color: inherit;
}

modelbutton:hover:not(:disabled),
modelbutton:focus:not(:disabled),
modelbutton:active:not(:disabled),
menuitem:hover:not(:disabled),
menuitem:selected:not(:disabled) {
  background-color: @theme_selected_bg_color;
  color: @theme_selected_fg_color;
}

modelbutton:disabled,
menuitem:disabled {
  color: @insensitive_fg_color;
}

tooltip,
tooltip.background {
  background-color: {{tokens.surface_elevated}};
  color: @theme_fg_color;
  border-color: {{tokens.border_strong}};
  text-shadow: none;
}

tooltip label {
  color: inherit;
}

headerbar,
.titlebar,
toolbar,
searchbar,
searchbar > revealer > box,
actionbar > revealer > box,
GtkHeaderBar,
GtkToolbar,
.searchbar-container,
GtkSearchBar {
  background-color: @titlebar_bg_color;
  background-image: none;
  color: @titlebar_fg_color;
  border-color: {{tokens.border_strong}};
}

.searchbar-container.inline,
GtkSearchBar.inline {
  background-color: @theme_base_color;
  color: @theme_text_color;
  border-color: @borders;
}

NautilusWindow .sidebar,
NemoWindow .sidebar,
.sidebar,
GtkPlacesSidebar,
placessidebar {
  background-color: @sidebar_bg_color;
  color: @sidebar_fg_color;
  border-color: {{tokens.border_strong}};
}

textview,
textview text,
textview border,
treeview,
iconview,
flowbox,
.view,
.content-view,
NautilusWindow .view {
  background-color: @theme_base_color;
  color: @theme_text_color;
  border-color: @borders;
}

/* List boxes and their rows have their own foreground in the base theme. */
list {
  background-color: @theme_base_color;
  color: @theme_text_color;
}

list > row {
  color: inherit;
}

list > row.activatable:hover {
  background-color: {{tokens.surface_elevated}};
}

flowboxchild:selected,
flowboxchild:selected:hover,
list > row:selected,
list > row:selected:hover,
treeview.view:selected,
iconview.view:selected {
  background-color: @theme_selected_bg_color;
  color: @theme_selected_fg_color;
}

list > row:disabled,
list > row label:disabled,
list > row image:disabled {
  color: @insensitive_fg_color;
}

entry,
GtkEntry,
searchentry {
  background-color: @theme_entry_background;
  background-image: none;
  color: @theme_entry_foreground;
  border-color: @borders;
  caret-color: {{tokens.accent}};
}

headerbar entry,
.titlebar entry,
.searchbar-container entry,
GtkSearchBar entry,
headerbar GtkEntry {
  background-color: @theme_base_color;
  color: @theme_text_color;
  border-color: {{tokens.border_strong}};
}

entry:focus,
GtkEntry:focus {
  border-color: {{tokens.accent}};
}

entry placeholder {
  color: {{tokens.text_muted}};
}

entry:disabled {
  background-color: {{tokens.bg_secondary}};
  color: {{tokens.text_muted}};
}

entry selection,
textview text selection,
.view selection {
  background-color: @theme_selected_bg_color;
  color: @theme_selected_fg_color;
}

VteTerminal,
vte-terminal,
TerminalWindow,
.terminal,
console {
  background-color: @terminal_bg_color;
  color: @terminal_fg_color;
}

.card,
.card-view,
list.boxed-list {
  background-color: {{tokens.surface_elevated}};
  color: @theme_fg_color;
  border-color: @borders;
}

button,
GtkButton {
  background-color: @theme_button_background_normal;
  /* GTK paints the base theme's gradient over background-color. */
  background-image: none;
  color: @theme_button_foreground_normal;
  border-color: @borders;
  text-shadow: none;
  -gtk-icon-shadow: none;
  box-shadow: none;
}

headerbar button,
.titlebar button {
  background-color: {{tokens.surface_elevated}};
  color: @theme_fg_color;
  border-color: @borders;
}

button:hover {
  background-color: @theme_button_background_hover;
  border-color: {{tokens.accent_hover}};
}

button:active {
  background-color: {{tokens.accent_active}};
  color: {{tokens.accent_fg}};
  border-color: {{tokens.accent_active}};
}

button:disabled {
  background-color: {{tokens.bg_secondary}};
  color: {{tokens.text_muted}};
  border-color: @borders;
}

button.suggested-action,
button:checked {
  background-color: {{tokens.accent}};
  color: {{tokens.accent_fg}};
  border-color: {{tokens.accent}};
}

/* Theme both switch nodes and clear the base theme's gradients. */
switch {
  background-color: {{tokens.surface_elevated}};
  background-image: none;
  color: {{tokens.text_muted}};
  border-color: {{tokens.border_strong}};
  box-shadow: none;
  text-shadow: none;
  -gtk-icon-shadow: none;
}

switch slider {
  background-color: {{tokens.text_muted}};
  background-image: none;
  color: {{tokens.surface_elevated}};
  border-color: transparent;
  box-shadow: none;
}

switch:hover {
  border-color: {{tokens.accent_hover}};
}

switch:checked {
  background-color: {{tokens.accent}};
  /* Keep the track from showing through the handle's antialiased edge. */
  background-clip: padding-box;
  color: {{tokens.accent_fg}};
  border-color: transparent;
}

switch:checked:hover {
  background-color: {{tokens.accent_hover}};
  border-color: transparent;
}

switch:checked slider {
  background-color: @theme_fg_color;
  color: {{tokens.accent}};
}

switch:disabled {
  opacity: 0.5;
}

button.destructive-action {
  background-color: {{tokens.error}};
  color: {{tokens.accent_fg}};
  border-color: {{tokens.error}};
}

.info {
  background-color: {{tokens.accent}};
  color: {{tokens.accent_fg}};
}

.success {
  background-color: {{tokens.success}};
  color: {{tokens.accent_fg}};
}

.warning {
  background-color: {{tokens.warning}};
  color: {{tokens.accent_fg}};
}

.error {
  background-color: {{tokens.error}};
  color: {{tokens.accent_fg}};
}

selection {
  background-color: @theme_selected_bg_color;
  color: @theme_selected_fg_color;
}

a,
link {
  color: @link_color;
}

.dim-label,
.subtitle {
  color: {{tokens.text_muted}};
}

/* GTK 3.24 CSS nodes: https://docs.gtk.org/gtk3/css-overview.html
 * Recolor the base theme's surfaces, retaining its geometry and icon shapes.
 * An app can request Adwaita-dark even when the generated palette is light.
 */
notebook,
notebook > stack {
  background-color: @theme_bg_color;
  color: @theme_fg_color;
  border-color: @borders;
}

notebook > header {
  background-color: {{tokens.surface}};
  background-image: none;
  color: @theme_fg_color;
  border-color: @borders;
}

notebook > header > tabs > tab {
  background-color: transparent;
  background-image: none;
  color: @insensitive_fg_color;
  border-color: transparent;
  box-shadow: none;
}

notebook > header > tabs > tab:hover {
  background-color: {{tokens.surface_elevated}};
  color: @theme_fg_color;
}

notebook > header > tabs > tab:checked {
  background-color: @theme_bg_color;
  color: @theme_fg_color;
}

notebook > header.top > tabs > tab:checked {
  box-shadow: inset 0 -2px {{tokens.accent}};
}

notebook > header.bottom > tabs > tab:checked {
  box-shadow: inset 0 2px {{tokens.accent}};
}

notebook > header.left > tabs > tab:checked {
  box-shadow: inset -2px 0 {{tokens.accent}};
}

notebook > header.right > tabs > tab:checked {
  box-shadow: inset 2px 0 {{tokens.accent}};
}

notebook > header > tabs > arrow {
  background-color: transparent;
  background-image: none;
  color: @theme_fg_color;
  border-color: transparent;
  box-shadow: none;
  text-shadow: none;
  -gtk-icon-shadow: none;
}

notebook > header > tabs > arrow:hover {
  background-color: {{tokens.surface_elevated}};
}

/* Check/radio nodes are also used by menus and tree-view cell renderers. */
check,
radio {
  background-color: @theme_base_color;
  background-image: none;
  color: @theme_text_color;
  border-color: {{tokens.text_muted}};
  box-shadow: none;
  text-shadow: none;
  -gtk-icon-shadow: none;
}

check:hover,
radio:hover {
  border-color: {{tokens.accent_hover}};
}

check:checked,
check:indeterminate,
radio:checked,
radio:indeterminate {
  background-color: {{tokens.accent}};
  color: {{tokens.accent_fg}};
  border-color: {{tokens.accent}};
}

spinbutton {
  background-color: @theme_entry_background;
  background-image: none;
  color: @theme_entry_foreground;
  border-color: @borders;
  box-shadow: none;
}

spinbutton:focus {
  border-color: {{tokens.accent}};
}

/* Do not recolor color chooser hue/alpha troughs: their gradients are data. */
scale,
progressbar {
  color: @theme_fg_color;
}

scale value,
scale marks,
progressbar text {
  color: @insensitive_fg_color;
}

scale marks indicator {
  background-color: @insensitive_fg_color;
  color: @insensitive_fg_color;
}

scale:not(.color) trough,
progressbar trough,
levelbar trough {
  background-color: @theme_base_color;
  background-image: none;
  border-color: @borders;
  box-shadow: none;
}

scale:not(.color) highlight,
progressbar progress,
entry progress {
  background-color: {{tokens.accent}};
  background-image: none;
  border-color: {{tokens.accent}};
  box-shadow: none;
}

scale:not(.color) fill {
  background-color: @theme_selected_bg_color;
  background-image: none;
  border-color: @borders;
}

scale:not(.color) slider {
  background-color: {{tokens.accent}};
  background-image: none;
  color: {{tokens.accent_fg}};
  border-color: {{tokens.accent}};
  border-radius: 100%;
  box-shadow: none;
}

scale:not(.color) slider:hover {
  background-color: {{tokens.accent_hover}};
  border-color: {{tokens.accent_hover}};
}

scale:not(.color) slider:active {
  background-color: {{tokens.accent_active}};
  border-color: {{tokens.accent_active}};
}

scrollbar,
scrollbar trough,
scrolledwindow junction {
  background-color: @theme_bg_color;
  background-image: none;
  color: @theme_fg_color;
  border-color: @borders;
  box-shadow: none;
}

scrollbar slider {
  background-color: {{tokens.text_muted}};
  background-image: none;
  border-color: transparent;
  box-shadow: none;
}

scrollbar slider:hover,
scrollbar slider:active {
  background-color: {{tokens.accent}};
}

/* Retain scroll-edge feedback with palette-derived colors. */
scrolledwindow overshoot.top,
scrolledwindow undershoot.top {
  background-image: linear-gradient(to bottom, alpha(@theme_fg_color, 0.15), transparent);
}

scrolledwindow overshoot.bottom,
scrolledwindow undershoot.bottom {
  background-image: linear-gradient(to top, alpha(@theme_fg_color, 0.15), transparent);
}

scrolledwindow overshoot.left,
scrolledwindow undershoot.left {
  background-image: linear-gradient(to right, alpha(@theme_fg_color, 0.15), transparent);
}

scrolledwindow overshoot.right,
scrolledwindow undershoot.right {
  background-image: linear-gradient(to left, alpha(@theme_fg_color, 0.15), transparent);
}

levelbar block {
  background-color: {{tokens.accent}};
  background-image: none;
  border-color: {{tokens.accent}};
  color: {{tokens.accent_fg}};
  box-shadow: none;
}

levelbar block.low {
  background-color: {{tokens.warning}};
  border-color: {{tokens.warning}};
}

levelbar block.high,
levelbar block.full {
  background-color: {{tokens.success}};
  border-color: {{tokens.success}};
}

levelbar block.empty {
  background-color: @theme_base_color;
  border-color: @borders;
  color: @theme_text_color;
}

frame > border,
.frame,
scrolledwindow {
  border-color: @borders;
}

separator,
paned > separator {
  background-color: @borders;
  background-image: none;
  color: @borders;
}

paned > separator:hover {
  background-color: {{tokens.accent}};
}

expander > title {
  color: @theme_fg_color;
}

expander > title > arrow {
  color: {{tokens.text_muted}};
}

expander > title > arrow:hover,
expander > title > arrow:checked {
  color: {{tokens.accent}};
}

calendar {
  background-color: @theme_base_color;
  color: @theme_text_color;
  border-color: @borders;
}

calendar.header {
  background-color: {{tokens.surface}};
  background-image: none;
  color: @theme_fg_color;
  border-color: @borders;
}

calendar.button {
  color: @theme_fg_color;
}

calendar.button:hover {
  color: {{tokens.accent}};
}

calendar.highlight {
  color: {{tokens.accent}};
}

calendar:selected {
  background-color: @theme_selected_bg_color;
  color: @theme_selected_fg_color;
}

calendar:indeterminate {
  color: @insensitive_fg_color;
}

rubberband {
  background-color: alpha({{tokens.accent}}, 0.2);
  border-color: {{tokens.accent}};
}

/* Semantic input errors remain inputs, rather than solid message banners. */
entry.error,
entry.warning {
  background-color: @theme_entry_background;
  color: @theme_entry_foreground;
}

entry.error { border-color: {{tokens.error}}; }
entry.warning { border-color: {{tokens.warning}}; }

infobar,
infobar > revealer > box {
  background-color: {{tokens.surface_elevated}};
  background-image: none;
  color: @theme_fg_color;
  border-color: @borders;
}

infobar.info,
infobar.info > revealer > box,
infobar.question,
infobar.question > revealer > box {
  background-color: {{tokens.accent}};
  color: {{tokens.accent_fg}};
}

infobar.warning,
infobar.warning > revealer > box {
  background-color: {{tokens.warning}};
  color: {{tokens.accent_fg}};
}

infobar.error,
infobar.error > revealer > box {
  background-color: {{tokens.error}};
  color: {{tokens.accent_fg}};
}

/* These nodes can carry base-theme foregrounds instead of inheriting. */
button label,
button image,
button arrow,
button cellview,
notebook tab label,
flowboxchild,
flowboxchild label,
infobar label {
  color: inherit;
}

spinner {
  color: @theme_fg_color;
}

button:link,
button:visited {
  background-color: transparent;
  color: @link_color;
}

label:disabled,
image:disabled,
checkbutton:disabled,
radiobutton:disabled,
expander > title:disabled,
expander > title > arrow:disabled,
notebook > header > tabs > tab:disabled,
notebook > header > tabs > arrow:disabled,
calendar:disabled,
scale value:disabled,
scale marks:disabled {
  color: @insensitive_fg_color;
}

button:disabled,
check:disabled,
radio:disabled,
spinbutton:disabled,
scale:not(.color) slider:disabled,
scale:not(.color) highlight:disabled {
  background-color: @insensitive_bg_color;
  color: @insensitive_fg_color;
  border-color: @borders;
}

check:checked:disabled,
check:indeterminate:disabled,
radio:checked:disabled,
radio:indeterminate:disabled,
scrollbar slider:disabled {
  background-color: {{tokens.text_muted}};
  color: @theme_bg_color;
}

*:focus {
  outline-color: {{tokens.accent}};
}
"""
