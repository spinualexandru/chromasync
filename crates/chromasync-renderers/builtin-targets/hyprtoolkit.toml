#:schema ../../../schemas/target.json
name = "hyprtoolkit"
description = "Hyprtoolkit palette (source from hyprtoolkit.conf)."
preferred_template = "materialish"
chroma = "subtle"

[[artifacts]]
file_name = "chromasync-hyprtoolkit.conf"
template = '''
# Generated by Chromasync. Source from hypr/hyprtoolkit.conf.
background = 0xff{{tokens.bg | hex_no_hash}}
base = 0xff{{tokens.surface | hex_no_hash}}
text = 0xff{{tokens.text | hex_no_hash}}
alternate_base = 0xff{{tokens.bg_secondary | hex_no_hash}}
bright_text = 0xff{{tokens.accent_fg | hex_no_hash}}
link_text = 0xff{{tokens.link | hex_no_hash}}
accent = 0xff{{tokens.accent | hex_no_hash}}
accent_secondary = 0xff{{tokens.accent_hover | hex_no_hash}}
'''
