#:schema ../../../schemas/target.json
name = "kitty"
description = "Built-in Kitty terminal theme target."

[[artifacts]]
file_name = "kitty.conf"
template = """
background {{tokens.bg}}
foreground {{tokens.text}}
selection_background {{tokens.selection}}
selection_foreground {{tokens.text}}
cursor {{tokens.accent}}
cursor_text_color {{tokens.accent_fg}}
url_color {{tokens.link}}
active_border_color {{tokens.accent}}
inactive_border_color {{tokens.border}}
active_tab_background {{tokens.accent}}
active_tab_foreground {{tokens.accent_fg}}
inactive_tab_background {{tokens.surface}}
inactive_tab_foreground {{tokens.text_muted}}
color0 {{tokens.bg_secondary}}
color1 {{tokens.error}}
color2 {{tokens.success}}
color3 {{tokens.warning}}
color4 {{tokens.link}}
color5 {{tokens.accent}}
color6 {{tokens.selection}}
color7 {{tokens.border_strong}}
color8 {{tokens.text_muted}}
color9 {{tokens.error}}
color10 {{tokens.success}}
color11 {{tokens.warning}}
color12 {{tokens.accent_hover}}
color13 {{tokens.accent_active}}
color14 {{tokens.border_strong}}
color15 {{tokens.text}}
"""
