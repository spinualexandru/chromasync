#:schema ../../../schemas/target.json
name = "limine"
description = "Limine graphical boot menu colors; merge into global configuration."
chroma = "vibrant"

[[artifacts]]
file_name = "chromasync-limine.conf"
template = '''
# Generated by Chromasync. Merge into the GLOBAL section of limine.conf.
# This fragment contains no boot entries.
interface_branding_colour: {{tokens.accent | hex_no_hash}}
interface_help_colour: {{tokens.text_muted | hex_no_hash}}
interface_help_colour_bright: {{tokens.text | hex_no_hash}}
term_foreground: {{tokens.text | hex_no_hash}}
term_foreground_bright: {{tokens.text | hex_no_hash}}
term_background_bright: {{tokens.selection | hex_no_hash}}
term_background: 00{{tokens.bg | hex_no_hash}}
term_palette: {{tokens.bg_secondary | hex_no_hash}};{{tokens.error | hex_no_hash}};{{tokens.success | hex_no_hash}};{{tokens.warning | hex_no_hash}};{{tokens.link | hex_no_hash}};{{tokens.accent | hex_no_hash}};{{tokens.accent_hover | hex_no_hash}};{{tokens.text_muted | hex_no_hash}}
term_palette_bright: {{tokens.border_strong | hex_no_hash}};{{tokens.error | hex_no_hash}};{{tokens.success | hex_no_hash}};{{tokens.warning | hex_no_hash}};{{tokens.link | hex_no_hash}};{{tokens.accent_active | hex_no_hash}};{{tokens.accent_hover | hex_no_hash}};{{tokens.text | hex_no_hash}}
'''
