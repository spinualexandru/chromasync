[workspace]
members = ["crates/*"]
default-members = ["crates/chromasync-cli"]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/spinualexandru/chromasync"
homepage = "https://github.com/spinualexandru/chromasync"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0.104"
assert_cmd = "2.2.2"
clap = { version = "4.6.7", default-features = false, features = [
  "derive",
  "help",
  "std",
  "usage",
] }
clap_complete = "4"
directories = "6.0.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
js-sys = "0.3.105"
owo-colors = "4.4.0"
palette = { version = "0.7.7", default-features = false, features = ["std"] }
predicates = "3.1.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rmcp = { version = "3.4.0", features = ["server", "transport-io"] }
schemars = "1"
thiserror = "2.0.20"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "1.1.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasm-bindgen = "0.2.128"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
panic = "abort"
strip = "symbols"
